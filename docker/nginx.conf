# nginx config for the QueueMed SPA (production image).
# Serves the static Vite build and routes all unknown paths back to index.html
# so client-side routing (react-router) works on deep links / refresh.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
