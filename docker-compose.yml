# QueueMed — local development stack (hot reload)
#
# Three clearly separated containers / services:
#
#   web         FRONTEND  — Vite + React SPA on http://localhost:8080.
#                           Talks directly to Supabase for data, and to the
#                           chat-api for the AI assistant.
#
#   chat-api    BACKEND    — AI chatbot agent (Vercel AI SDK). Validates the
#                           user's Supabase JWT and drives the MCP tools.
#                           http://localhost:8787
#
#   mcp-server  BACKEND    — MCP tools over Streamable HTTP on :3001. Enforces
#                           per-user RBAC guardrails from the forwarded JWT.
#
# Supabase is the data backend and is NOT defined here — run it with the
# Supabase CLI (`supabase start`). From inside containers a host Supabase is
# reachable at http://host.docker.internal:54321.
#
# Usage:
#   cp .env.example .env      # fill in values (GROQ_API_KEY, SUPABASE_*)
#   docker compose up --build

name: queuemed

services:
  web:
    container_name: queuemed-web
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @queuemed/web dev -- --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      # The browser reaches chat-api on the host-published port.
      VITE_CHAT_API_URL: http://localhost:8787
      # Gate: skip queue notifications when Twilio is not wired.
      # Must be the string "true" (Vite inlines this at build time).
      VITE_SMS_ENABLED: false
      # Windows bind mount → no inotify in the container; poll for file changes
      # so Vite HMR actually picks up host edits.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - web_root_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_core_node_modules:/app/packages/core/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - queuemed
    restart: unless-stopped

  chat-api:
    container_name: queuemed-chat-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @queuemed/chat-api dev
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      CHAT_API_PORT: "8787"
      # Reach the MCP server over the compose network (service name DNS).
      MCP_SERVER_URL: http://mcp-server:3001/mcp
    volumes:
      - ./:/app
      - chat_root_node_modules:/app/node_modules
      - chat_app_node_modules:/app/apps/chat-api/node_modules
    depends_on:
      - mcp-server
    networks:
      - queuemed
    restart: unless-stopped

  mcp-server:
    container_name: queuemed-mcp-server
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Build the shared core package, then run the MCP HTTP transport in watch mode.
    command: sh -c "pnpm --filter @queuemed/core build && pnpm --filter @queuemed/mcp-server dev:http"
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      SERVER_PORT: "3001"
    volumes:
      - ./:/app
      - mcp_root_node_modules:/app/node_modules
      - mcp_app_node_modules:/app/apps/mcp-server/node_modules
      - mcp_core_node_modules:/app/packages/core/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - queuemed
    restart: unless-stopped

networks:
  queuemed:
    driver: bridge

volumes:
  web_root_node_modules:
  web_app_node_modules:
  web_core_node_modules:
  chat_root_node_modules:
  chat_app_node_modules:
  mcp_root_node_modules:
  mcp_app_node_modules:
  mcp_core_node_modules:
